services:
  db:
    image: postgres:17-alpine
    container_name: runningstats_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-runningstats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-runningstats}
      POSTGRES_DB: ${POSTGRES_DB:-runningstats}
    ports:
      # 5432 est déjà utilisé sur la machine de dev : on expose sur 5433.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
